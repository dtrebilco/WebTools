<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Share Purchases – Pro-rata Total Cost Base Adjustment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  body {
    font-family: -apple-system, BlinkMacOSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 20px;
    background: #f8f9fa;
    color: #222;
  }
  h1 { color: #2c3e50; }
  .container { max-width: 1400px; margin: 0 auto; }
  .controls {
    margin: 20px 0;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  button, input[type="file"] {
    padding: 10px 16px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
  }
  button {
    background: #3498db;
    color: white;
    border: none;
  }
  button:hover { background: #2980b9; }
  button:disabled { background: #95a5a6; cursor: not-allowed; }
  #message { color: #e74c3c; font-weight: 500; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 24px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow-x: auto;
    display: block;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px 10px;
    text-align: left;
  }
  th {
    background: #34495e;
    color: white;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  td input {
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
  }
  td input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
  }
  .filename { font-weight: 500; color: #2c3e50; }
  #adjustmentPanel {
    margin: 24px 0 40px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .adj-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #eee;
  }
  .adj-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .symbol { flex: 1; font-weight: 500; }
  .shares { color: #555; font-size: 0.95rem; }
  .input-group { display: flex; align-items: center; gap: 8px; }
  .input-group input { width: 180px; }
</style>
</head>
<body>

<div class="container">
  <h1>Share Purchases – Pro-rata Total Cost Base Adjustment</h1>

  <div class="controls">
    <input type="file" id="fileInput" accept=".csv,text/csv" />
    <button id="downloadBtn" onclick="downloadCSV()" disabled>Download updated CSV</button>
    <span id="message"></span>
  </div>

  <div id="filenameDisplay" style="margin: 8px 0; min-height: 1.4em;"></div>

  <div id="adjustmentPanel"></div>

  <div id="tableContainer"></div>
</div>

<script>
// ────────────────────────────────────────────────
let data = [];
let headers = [];
let originalFilename = "edited.csv";
let symbolHeader = null;
let countHeader = null;
let priceHeader = null;
let uniqueSymbols = [];
let symbolToTotalShares = {};

const fileInput      = document.getElementById('fileInput');
const downloadBtn    = document.getElementById('downloadBtn');
const messageEl      = document.getElementById('message');
const filenameDisplay = document.getElementById('filenameDisplay');
const tableContainer = document.getElementById('tableContainer');
const adjustmentPanel = document.getElementById('adjustmentPanel');

fileInput.addEventListener('change', handleFileSelect);

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  originalFilename = file.name;
  filenameDisplay.innerHTML = `Loaded: <span class="filename">${escapeHTML(originalFilename)}</span>`;

  messageEl.textContent = "Reading file...";
  downloadBtn.disabled = false;

  const reader = new FileReader();
  reader.onload = function(e) {
    parseCSV(e.target.result);
    messageEl.textContent = "";
  };
  reader.onerror = () => {
    messageEl.textContent = "Error reading file";
    downloadBtn.disabled = true;
  };
  reader.readAsText(file);
}

function parseCSV(csvText) {
  const lines = csvText.trim().split(/\r?\n/);
  if (lines.length === 0) return;

  function parseLine(line) {
    const row = [];
    let inQuote = false;
    let field = '';
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuote && line[i+1] === '"') { field += '"'; i++; }
        else inQuote = !inQuote;
      } else if (char === ',' && !inQuote) {
        row.push(field);
        field = '';
      } else {
        field += char;
      }
    }
    row.push(field);
    return row;
  }

  const rawRows = lines.map(parseLine);
  headers = rawRows[0];

  data = rawRows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = row[i] ?? '');
    return obj;
  });

  // Auto-detect columns
  const lower = headers.map(h => h.toLowerCase().trim());
  symbolHeader = headers.find((h,i) => /symbol|ticker|code|asx|stock/i.test(lower[i])) ||
                 (headers.length > 0 ? headers[0] : null);

  countHeader = headers.find((h,i) => /count|shares|quantity|units|no\.|num/i.test(lower[i])) ||
                (headers.length > 1 ? headers[1] : null);

  priceHeader = headers.find((h,i) => /price|cost|purchase|buy|avg/i.test(lower[i])) ||
                (headers.length > 2 ? headers[2] : null);

  // Calculate total shares per symbol
  symbolToTotalShares = {};
  data.forEach(row => {
    const sym = (row[symbolHeader] || '').trim();
    if (!sym) return;
    const cntStr = row[countHeader] || '0';
    const cnt = parseFloat(cntStr) || 0;
    symbolToTotalShares[sym] = (symbolToTotalShares[sym] || 0) + cnt;
  });

  uniqueSymbols = Object.keys(symbolToTotalShares).sort();

  renderAdjustmentPanel();
  renderTable();
}

function renderTable() {
  if (data.length === 0) {
    tableContainer.innerHTML = "<p>No data to display</p>";
    return;
  }

  let html = '<table><thead><tr>';
  headers.forEach(h => html += `<th>${escapeHTML(h)}</th>`);
  html += '</tr></thead><tbody>';

  data.forEach((row, rowIndex) => {
    html += '<tr>';
    headers.forEach((header, colIndex) => {
      const val = row[header] ?? '';
      html += `<td><input type="text" value="${escapeHTML(val)}"
               data-row="${rowIndex}" data-col="${colIndex}"
               onchange="updateCell(this)"></td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  tableContainer.innerHTML = html;
}

function updateCell(input) {
  const rowIdx = parseInt(input.dataset.row);
  const colIdx = parseInt(input.dataset.col);
  const header = headers[colIdx];
  data[rowIdx][header] = input.value;
}

function renderAdjustmentPanel() {
  adjustmentPanel.innerHTML = '';

  if (!symbolHeader || !countHeader || !priceHeader) {
    adjustmentPanel.innerHTML = `
      <h2>Pro-rata Total Cost Base Adjustments</h2>
      <p style="color:#e74c3c;">Could not auto-detect required columns:<br>
      • Stock Symbol / Ticker<br>
      • Count / Shares / Quantity<br>
      • Purchase Price / Cost<br><br>
      Please check your CSV headers and try again.</p>`;
    return;
  }

  let html = `
    <h2>Pro-rata Total Cost Base Adjustments</h2>
    <p>Enter the <strong>total $ adjustment amount</strong> for each stock symbol.<br>
       This total will be <strong>pro-rated</strong> across all purchases of that symbol<br>
       based on the number of shares in each row.</p>
    <div style="max-width:600px;">`;

  uniqueSymbols.forEach(sym => {
    const totalShares = symbolToTotalShares[sym] || 0;
    const safeId = 'adj_' + String(sym).replace(/[^a-z0-9]/gi, '_');
    html += `
    <div class="adj-row">
      <span class="symbol">${escapeHTML(sym)}</span>
      <span class="shares">(${totalShares.toLocaleString()} shares total)</span>
      <div class="input-group">
        <span>$</span>
        <input type="number" id="${safeId}" step="0.01" value="0" min="0">
      </div>
    </div>`;
  });

  html += `</div>
    <button onclick="applyAdjustments()" style="margin-top:20px; padding:12px 28px; font-size:1.1rem;">
      Apply Adjustments
    </button>
    <p style="font-size:0.9rem; color:#666; margin-top:16px;">
      Result: each row gets <strong>adjustment = total_$ × (row_shares / total_shares)</strong><br>
      added to its original purchase price → new column <strong>Adjusted Cost Base</strong>.
    </p>`;

  adjustmentPanel.innerHTML = html;
}

function applyAdjustments() {
  if (!symbolHeader || !countHeader || !priceHeader || uniqueSymbols.length === 0) return;

  const adjustmentsTotal = {};
  uniqueSymbols.forEach(sym => {
    const safeId = 'adj_' + String(sym).replace(/[^a-z0-9]/gi, '_');
    const input = document.getElementById(safeId);
    adjustmentsTotal[sym] = input ? (parseFloat(input.value) || 0) : 0;
  });

  const adjustedHeader = "Adjusted Cost Base";

  // Add column if missing
  if (!headers.includes(adjustedHeader)) {
    headers.push(adjustedHeader);
  }

  data.forEach(row => {
    const sym = (row[symbolHeader] || '').trim();
    const rowSharesStr = row[countHeader] || '0';
    const rowShares = parseFloat(rowSharesStr) || 0;

    const totalAdj = adjustmentsTotal[sym] || 0;
    const totalShares = symbolToTotalShares[sym] || 0;

    let rowAdj = 0;
    if (totalShares > 0 && rowShares > 0) {
      rowAdj = totalAdj * (rowShares / totalShares);
    }

    const origStr = row[priceHeader] || "0";
    let origPrice = parseFloat(origStr);
    if (isNaN(origPrice)) origPrice = 0;

    // Add the pro-rated adjustment to this row's price
    row[adjustedHeader] = (origPrice + rowAdj).toFixed(6);
  });

  renderTable();
  messageEl.textContent = `Pro-rata adjustments applied – "${adjustedHeader}" column updated`;
}

function downloadCSV() {
  if (data.length === 0) {
    messageEl.textContent = "Nothing to download";
    return;
  }

  let csv = headers.map(escapeCSV).join(',') + '\n';

  data.forEach(row => {
    const values = headers.map(h => escapeCSV(row[h] ?? ''));
    csv += values.join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = originalFilename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  messageEl.textContent = `Downloaded ${originalFilename}`;
}

function escapeCSV(str) {
  if (str == null) return '';
  str = String(str);
  if (str.includes(',') || str.includes('"') || str.includes('\n')) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

function escapeHTML(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

</script>
</body>
</html>
